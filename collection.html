    <!-- Slider JS: Slide Left to Right and Right to Left -->
    <script>
      let currentSlide = 0;
      const totalSlides = 6;
      const track = document.getElementById('slide-track');
      const dots = document.querySelectorAll('.indicator-dot');

      function updateSlider(index) {
        if (index < 0) currentSlide = totalSlides - 1;
        else if (index >= totalSlides) currentSlide = 0;
        else currentSlide = index;

        track.style.transform = `translateX(-${currentSlide * 100}%)`;

        dots.forEach((dot, idx) => {
          if (idx === currentSlide) {
            dot.className = 'indicator-dot w-8 h-2 rounded-full bg-[#0f2135] transition-all cursor-pointer';
          } else {
            dot.className = 'indicator-dot w-2.5 h-2 rounded-full bg-white/60 hover:bg-white transition-all cursor-pointer';
          }
        });
      }

      // Dot click to slide left-to-right / right-to-left
      dots.forEach((dot) => {
        dot.addEventListener('click', () => {
          const idx = parseInt(dot.getAttribute('data-index') || '0', 10);
          updateSlider(idx);
        });
      });


      // Touch swipe left/right for seamless mobile navigation
      let touchStartX = 0;
      let touchEndX = 0;
      const slider = document.getElementById('slider-viewport');
      if (slider) {
        slider.addEventListener('touchstart', (e) => {
          touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        slider.addEventListener('touchend', (e) => {
          touchEndX = e.changedTouches[0].screenX;
          const diff = touchStartX - touchEndX;
          if (diff > 45) updateSlider(currentSlide + 1); // Swipe left -> next
          if (diff < -45) updateSlider(currentSlide - 1); // Swipe right -> prev
        }, { passive: true });
      }

      // Keyboard arrow keys
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') updateSlider(currentSlide - 1);
        if (e.key === 'ArrowRight') updateSlider(currentSlide + 1);
      });

      // Mobile Menu
      const toggle = document.getElementById('mobile-menu-toggle');
      const menu = document.getElementById('mobile-menu');
      const hamburger = document.getElementById('hamburger-icon');
      const closeIcon = document.getElementById('close-icon');

      if (toggle && menu) {
        toggle.addEventListener('click', () => {
          const isHidden = menu.classList.contains('hidden');
          if (isHidden) {
            menu.classList.remove('hidden');
            if (hamburger) hamburger.classList.add('hidden');
            if (closeIcon) closeIcon.classList.remove('hidden');
          } else {
            menu.classList.add('hidden');
            if (hamburger) hamburger.classList.remove('hidden');
            if (closeIcon) closeIcon.classList.add('hidden');
          }
        });
      }
    </script>
